<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>فرم ثبت اطلاعات</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background: #f0f2f5; padding: 16px; }
    .container { max-width: 480px; margin: 0 auto; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; font-size: 1.3rem; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.95rem; }
    .input-row { display: flex; gap: 8px; align-items: stretch; }
    .input-row input,
    .input-row textarea {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      background: #fafafa;
    }
    .input-row textarea { min-height: 100px; resize: vertical; }
    .mic-btn {
      width: 48px;
      min-width: 48px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mic-btn.listening { background: #ef4444; }
    .photo-box { border: 2px dashed #aaa; border-radius: 12px; padding: 16px; text-align: center; background: #fafafa; cursor: pointer; }
    .photo-preview { max-width: 130px; max-height: 130px; border-radius: 10px; margin-top: 10px; display: none; object-fit: cover; }
    .gender-box { display: flex; gap: 20px; margin-top: 8px; }
    .gender-box label { font-weight: normal; display: flex; align-items: center; gap: 6px; }
    .status { text-align: center; margin: 14px 0; font-size: 0.9rem; color: #666; min-height: 22px; }
    .status.listening { color: #ef4444; font-weight: bold; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn-save { background: #16a34a; color: white; }
    .btn-download { background: #2563eb; color: white; }
    .btn-view { background: #7c3aed; color: white; }
    .btn-photo { background: #d97706; color: white; }
    .btn-clear { background: #dc2626; color: white; }
    .counter { text-align: center; margin: 12px 0; font-size: 0.95rem; background: #f1f5f9; padding: 8px; border-radius: 8px; }

    /* مودال مشاهده اطلاعات */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-overlay.show { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 640px;
      margin: 20px auto;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .modal h2 { text-align: center; margin-bottom: 16px; font-size: 1.2rem; }
    .modal-table-wrap { overflow-x: auto; max-height: 60vh; }
    .modal table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .modal th, .modal td {
      border: 1px solid #ddd;
      padding: 8px 6px;
      text-align: right;
      white-space: nowrap;
    }
    .modal th { background: #f1f5f9; font-weight: bold; position: sticky; top: 0; }
    .modal td.message-cell { white-space: normal; max-width: 180px; }
    .modal-close {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #64748b;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-empty { text-align: center; color: #666; padding: 30px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>فرم ثبت اطلاعات</h1>
    <p class="subtitle">اطلاعات روی گوشی ذخیره می‌شود</p>

    <div class="counter" id="counter">تعداد رکوردهای ذخیره شده: ۰</div>

    <form id="voiceForm">
      <!-- عکس -->
      <div class="form-group">
        <label>عکس فرد</label>
        <div class="photo-box" onclick="document.getElementById('photo').click()">
          <div>📷 برای انتخاب عکس کلیک کنید</div>
          <img id="preview" class="photo-preview">
        </div>
        <input type="file" id="photo" accept="image/*" capture="user" style="display:none">
        <button type="button" class="btn btn-photo" onclick="downloadPhoto()" style="margin-top:10px; display:none;" id="btnDownloadPhoto">
          📥 دانلود عکس (ذخیره در گالری)
        </button>
      </div>

      <!-- جنسیت -->
      <div class="form-group">
        <label>جنسیت</label>
        <div class="gender-box">
          <label><input type="radio" name="gender" value="آقا" checked> آقا</label>
          <label><input type="radio" name="gender" value="خانم"> خانم</label>
        </div>
      </div>

      <div class="form-group">
        <label>نام و نام خانوادگی</label>
        <div class="input-row">
          <input type="text" id="name" placeholder="نام را بگویید یا بنویسید">
          <button type="button" class="mic-btn" data-target="name">🎤</button>
        </div>
      </div>

      <div class="form-group">
        <label>شماره تماس</label>
        <div class="input-row">
          <input type="tel" id="phone" placeholder="شماره تماس">
          <button type="button" class="mic-btn" data-target="phone">🎤</button>
        </div>
      </div>

      <div class="form-group">
        <label>موضوع</label>
        <div class="input-row">
          <input type="text" id="subject" placeholder="موضوع">
          <button type="button" class="mic-btn" data-target="subject">🎤</button>
        </div>
      </div>

      <div class="form-group">
        <label>پیام</label>
        <div class="input-row">
          <textarea id="message" placeholder="متن پیام..."></textarea>
          <button type="button" class="mic-btn" data-target="message">🎤</button>
        </div>
      </div>

      <div class="status" id="status">آماده دریافت صدا...</div>

      <button type="submit" class="btn btn-save">✅ ثبت و رکورد بعدی</button>
      <button type="button" class="btn btn-view" onclick="openRecordsModal()">📋 مشاهده اطلاعات ذخیره شده</button>
      <button type="button" class="btn btn-download" onclick="downloadExcel()">📥 دانلود همه اطلاعات (اکسل)</button>
      <button type="button" class="btn btn-clear" onclick="clearData()">🗑️ پاک کردن همه اطلاعات</button>
    </form>
  </div>

  <!-- مودال مشاهده رکوردها -->
  <div class="modal-overlay" id="recordsModal">
    <div class="modal">
      <h2>اطلاعات ذخیره شده</h2>
      <div class="modal-table-wrap" id="recordsTableWrap"></div>
      <button type="button" class="modal-close" onclick="closeRecordsModal()">بستن</button>
    </div>
  </div>

  <script>
    function updateCounter() {
      const data = JSON.parse(localStorage.getItem('formRecords') || '[]');
      document.getElementById('counter').textContent = `تعداد رکوردهای ذخیره شده: ${data.length}`;
    }
    updateCounter();

    let photoName = '';
    let photoBase64 = '';

    document.getElementById('photo').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        photoName = file.name;
        const reader = new FileReader();
        reader.onload = function(event) {
          photoBase64 = event.target.result;
          const preview = document.getElementById('preview');
          preview.src = photoBase64;
          preview.style.display = 'block';
          document.getElementById('btnDownloadPhoto').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    function makePhotoFileName(name) {
      const safe = (name || 'بدون_نام')
        .trim()
        .replace(/[\\/:*?"<>|]/g, '_')
        .replace(/\s+/g, ' ');
      return safe + '.jpg';
    }

    function downloadPhoto(base64, fileName) {
      if (!base64) {
        if (!photoBase64) return alert('عکسی انتخاب نشده');
        base64 = photoBase64;
        const personName = document.getElementById('name').value.trim() || 'بدون_نام';
        fileName = makePhotoFileName(personName);
      }
      const link = document.createElement('a');
      link.href = base64;
      link.download = fileName;
      link.click();
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let currentTarget = null;

    function createRecognition() {
      const recog = new SpeechRecognition();
      recog.lang = 'fa-IR';
      recog.interimResults = false;
      recog.continuous = false;

      recog.onstart = () => {
        document.getElementById('status').textContent = 'در حال گوش دادن...';
        document.getElementById('status').classList.add('listening');
        document.querySelector(`[data-target="${currentTarget}"]`)?.classList.add('listening');
      };

      recog.onresult = (e) => {
        const text = e.results[0][0].transcript;
        const field = document.getElementById(currentTarget);
        field.value = field.value ? field.value + ' ' + text : text;
      };

      recog.onerror = (e) => {
        let msg = 'خطا در تشخیص صدا';
        if (e.error === 'not-allowed') msg = 'دسترسی میکروفن داده نشده';
        document.getElementById('status').textContent = msg;
      };

      recog.onend = () => {
        document.getElementById('status').textContent = 'آماده دریافت صدا...';
        document.getElementById('status').classList.remove('listening');
        document.querySelectorAll('.mic-btn').forEach(b => b.classList.remove('listening'));
      };
      return recog;
    }

    document.querySelectorAll('.mic-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!SpeechRecognition) return alert('مرورگر پشتیبانی نمی‌کند');
        if (recognition) recognition.stop();
        currentTarget = btn.dataset.target;
        recognition = createRecognition();
        recognition.start();
      });
    });

    document.getElementById('voiceForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const gender = document.querySelector('input[name="gender"]:checked')?.value || '-';
      const personName = document.getElementById('name').value.trim() || 'بدون_نام';
      const photoFileName = makePhotoFileName(personName);

      const hadPhoto = !!photoBase64;
      if (hadPhoto) {
        downloadPhoto(photoBase64, photoFileName);
      }

      const record = {
        gender: gender,
        name: personName,
        phone: document.getElementById('phone').value || '-',
        subject: document.getElementById('subject').value || '-',
        message: document.getElementById('message').value || '-',
        photo: photoFileName,
        date: new Date().toLocaleString('fa-IR')
      };

      const records = JSON.parse(localStorage.getItem('formRecords') || '[]');
      records.push(record);
      localStorage.setItem('formRecords', JSON.stringify(records));

      document.getElementById('voiceForm').reset();
      document.getElementById('preview').style.display = 'none';
      document.getElementById('btnDownloadPhoto').style.display = 'none';
      photoName = '';
      photoBase64 = '';
      document.querySelector('input[name="gender"][value="آقا"]').checked = true;

      updateCounter();
      alert(hadPhoto
        ? 'رکورد ثبت شد\nعکس هم با نام «' + photoFileName + '» ذخیره شد'
        : 'رکورد ثبت شد');
    });

    function downloadExcel() {
      const records = JSON.parse(localStorage.getItem('formRecords') || '[]');
      if (records.length === 0) return alert('هنوز اطلاعاتی ذخیره نشده');

      const data = [['جنسیت', 'نام و نام خانوادگی', 'شماره تماس', 'موضوع', 'پیام', 'نام فایل عکس', 'تاریخ ثبت']];
      records.forEach(r => data.push([r.gender, r.name, r.phone, r.subject, r.message, r.photo, r.date]));

      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'اطلاعات');
      XLSX.writeFile(wb, 'اطلاعات_فرم.xlsx');
    }

    function clearData() {
      if (confirm('همه اطلاعات پاک شود؟')) {
        localStorage.removeItem('formRecords');
        updateCounter();
        alert('پاک شد');
      }
    }

    function openRecordsModal() {
      const records = JSON.parse(localStorage.getItem('formRecords') || '[]');
      const wrap = document.getElementById('recordsTableWrap');

      if (records.length === 0) {
        wrap.innerHTML = '<p class="modal-empty">هنوز رکوردی ذخیره نشده است.</p>';
      } else {
        let html = '<table><thead><tr>';
        html += '<th>#</th><th>جنسیت</th><th>نام</th><th>تماس</th><th>موضوع</th><th>پیام</th><th>عکس</th><th>تاریخ</th>';
        html += '</tr></thead><tbody>';
        records.forEach((r, i) => {
          html += '<tr>';
          html += `<td>${i + 1}</td>`;
          html += `<td>${r.gender || '-'}</td>`;
          html += `<td>${r.name || '-'}</td>`;
          html += `<td>${r.phone || '-'}</td>`;
          html += `<td>${r.subject || '-'}</td>`;
          html += `<td class="message-cell">${r.message || '-'}</td>`;
          html += `<td>${r.photo || '-'}</td>`;
          html += `<td>${r.date || '-'}</td>`;
          html += '</tr>';
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;
      }
      document.getElementById('recordsModal').classList.add('show');
    }

    function closeRecordsModal() {
      document.getElementById('recordsModal').classList.remove('show');
    }

    document.getElementById('recordsModal').addEventListener('click', function(e) {
      if (e.target === this) closeRecordsModal();
    });
  </script>
</body>
</html>
