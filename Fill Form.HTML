<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>فرم صوتی + عکس + اکسل</title>
  <!-- کتابخانه ساخت فایل اکسل -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, 'Segoe UI', sans-serif;
    }

    body {
      background: #f0f2f5;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      color: #333;
    }

    input, textarea {
      width: 100%;
      padding: 12px 48px 12px 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      background: #fafafa;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #4f46e5;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .mic-btn {
      position: absolute;
      left: 8px;
      top: 34px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-btn.listening {
      background: #ef4444;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .photo-box {
      border: 2px dashed #ccc;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
    }

    .photo-preview {
      max-width: 140px;
      max-height: 140px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
      object-fit: cover;
    }

    .status {
      text-align: center;
      margin: 16px 0;
      font-size: 0.9rem;
      color: #666;
      min-height: 24px;
    }

    .status.listening {
      color: #ef4444;
      font-weight: bold;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .note {
      margin-top: 18px;
      padding: 12px;
      background: #f0fdf4;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #166534;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>فرم صوتی + عکس</h1>
    <p class="subtitle">اطلاعات بعد از ارسال به صورت فایل اکسل دانلود می‌شود</p>

    <form id="voiceForm">
      <!-- عکس -->
      <div class="form-group">
        <label>عکس فرد</label>
        <div class="photo-box" onclick="document.getElementById('photo').click()">
          <div>📷 برای انتخاب عکس کلیک کنید</div>
          <img id="preview" class="photo-preview" alt="پیش‌نمایش">
        </div>
        <input type="file" id="photo" accept="image/*" capture="user" style="display: none;">
      </div>

      <div class="form-group">
        <label for="name">نام و نام خانوادگی</label>
        <input type="text" id="name" placeholder="مثال: علی رضایی">
        <button type="button" class="mic-btn" data-target="name">🎤</button>
      </div>

      <div class="form-group">
        <label for="phone">شماره تماس</label>
        <input type="tel" id="phone" placeholder="مثال: ۰۹۱۲۳۴۵۶۷۸۹">
        <button type="button" class="mic-btn" data-target="phone">🎤</button>
      </div>

      <div class="form-group">
        <label for="subject">موضوع</label>
        <input type="text" id="subject" placeholder="موضوع پیام">
        <button type="button" class="mic-btn" data-target="subject">🎤</button>
      </div>

      <div class="form-group">
        <label for="message">پیام</label>
        <textarea id="message" placeholder="متن پیام خود را بگویید..."></textarea>
        <button type="button" class="mic-btn" data-target="message" style="top: 38px;">🎤</button>
      </div>

      <div class="status" id="status">آماده دریافت صدا...</div>

      <button type="submit" class="submit-btn">ارسال و دانلود اکسل</button>
    </form>

    <div class="note">
      بعد از زدن دکمه ارسال، فایل اکسل به صورت خودکار دانلود می‌شود.
    </div>
  </div>

  <script>
    // پیش‌نمایش عکس
    let photoBase64 = "";
    document.getElementById('photo').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          photoBase64 = event.target.result;
          const preview = document.getElementById('preview');
          preview.src = photoBase64;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // تشخیص صدا
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let currentTarget = null;

    if (!SpeechRecognition) {
      document.getElementById('status').textContent = 'مرورگر شما از تشخیص صدا پشتیبانی نمی‌کند';
    }

    function createRecognition() {
      const recog = new SpeechRecognition();
      recog.lang = 'fa-IR';
      recog.interimResults = false;
      recog.continuous = false;

      recog.onstart = () => {
        document.getElementById('status').textContent = 'در حال گوش دادن... صحبت کنید';
        document.getElementById('status').classList.add('listening');
        if (currentTarget) {
          document.querySelector(`[data-target="${currentTarget}"]`).classList.add('listening');
        }
      };

      recog.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (currentTarget) {
          const field = document.getElementById(currentTarget);
          field.value = field.value ? field.value + ' ' + text : text;
        }
      };

      recog.onerror = (event) => {
        let msg = 'خطا در تشخیص صدا';
        if (event.error === 'not-allowed') msg = 'دسترسی به میکروفن داده نشده';
        if (event.error === 'no-speech') msg = 'صدایی شنیده نشد';
        document.getElementById('status').textContent = msg;
      };

      recog.onend = () => {
        document.getElementById('status').textContent = 'آماده دریافت صدا...';
        document.getElementById('status').classList.remove('listening');
        document.querySelectorAll('.mic-btn').forEach(btn => btn.classList.remove('listening'));
        currentTarget = null;
      };

      return recog;
    }

    document.querySelectorAll('.mic-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!SpeechRecognition) return;
        if (recognition) recognition.stop();
        currentTarget = btn.dataset.target;
        recognition = createRecognition();
        recognition.start();
      });
    });

    // ارسال فرم و ساخت اکسل
    document.getElementById('voiceForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value || '-';
      const phone = document.getElementById('phone').value || '-';
      const subject = document.getElementById('subject').value || '-';
      const message = document.getElementById('message').value || '-';
      const date = new Date().toLocaleString('fa-IR');

      // داده‌های اکسل
      const data = [
        ['نام و نام خانوادگی', 'شماره تماس', 'موضوع', 'پیام', 'تاریخ ثبت'],
        [name, phone, subject, message, date]
      ];

      // ساخت فایل اکسل
      const worksheet = XLSX.utils.aoa_to_sheet(data);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'اطلاعات فرم');

      // دانلود فایل
      XLSX.writeFile(workbook, `فرم_${name || 'بدون_نام'}.xlsx`);

      alert('فایل اکسل با موفقیت دانلود شد.');
    });
  </script>
</body>
</html>
